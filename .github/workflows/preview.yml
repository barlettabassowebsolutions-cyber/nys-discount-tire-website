# Publishes a preview copy of the site to GitHub Pages every time main changes.
# The preview tells search engines not to list it, so it never competes with the
# real site at nysdiscounttire.com. The files in this repository are not changed.
name: Preview site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy the website files and mark them "don't list in search"
        run: |
          mkdir _site
          cp -r *.html css js images _site/
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex">|' _site/*.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
